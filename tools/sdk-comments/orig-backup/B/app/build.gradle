apply plugin: 'com.android.application'

// uni 离线 SDK libs（5.24，须≥HBuilderX编译器版本，否则appkey校验可能失败）与 Xilu-AD 插件 AAR 目录
def sdkLibsDir = file("${rootProject.projectDir}/../vendor/uni-offline-sdk/Android-SDK@5.24.82669_20260813/SDK/libs")
// Xilu AAR 统一来源：Core + 6 Adapter + 6 三方底包（共 13 个）
// 桥接插件改为直接依赖 ../xilu-ad-bridge 源码工程；华为/荣耀 OAID 改为线上仓库依赖（见 dependencies）
def xiluAarDir = file("${rootProject.projectDir}/../vendor/xilu")

// 打包期补丁：静默 DCloud uni-AD 提示
def patchTargets = [
        [aar: 'lib.5plus.base-release.aar', expect: 1],   // NativeUIFeatureImpl（execute + a(toast)）
]
def patchedLibsDir = file("${rootProject.projectDir}/patched-libs")
// ASM 从 Gradle 缓存取，只取 9.x
def asmJars = fileTree("${System.properties['user.home']}/.gradle/caches/modules-2/files-2.1/org.ow2.asm") {
    include '**/asm-9*.jar', '**/asm-tree-9*.jar'
}.files.findAll { it.name.contains('-9.') && !it.name.contains('sources') }

tasks.register('compileAdToastPatcher', JavaCompile) {
    source = fileTree("${rootProject.projectDir}/tools") { include 'AdToastPatcher.java' }
    classpath = files(asmJars)
    destinationDirectory = layout.buildDirectory.dir('patcher-classes')
    options.encoding = 'UTF-8'
}

def patchedAars = []
def patchTaskNames = []
def forceRunPatch = true
patchTargets.eachWithIndex { t, idx ->
    def name = t.aar
    def out = file("${patchedLibsDir}/${name}")
    patchedAars << out
    patchTaskNames << "patchDcloudAdToast${idx}"
    tasks.register("patchDcloudAdToast${idx}", JavaExec) {
        dependsOn 'compileAdToastPatcher'
        classpath = files(asmJars) + files(layout.buildDirectory.dir('patcher-classes'))
        mainClass = 'AdToastPatcher'
        args file("${sdkLibsDir}/${name}").absolutePath, out.absolutePath, "${t.expect}"
        inputs.file(file("${sdkLibsDir}/${name}"))
        inputs.file(file("${rootProject.projectDir}/tools/AdToastPatcher.java"))
        outputs.file(out)
        outputs.upToDateWhen { !forceRunPatch }
    }
}
//ELF 补丁（与5.24版本绑定）
def forceRunElfPatch = true
tasks.register('patchWeexcoreExit') {
    def vendorAar = file("${sdkLibsDir}/uniapp-v8-release.aar")
    def targetAar = file("${patchedLibsDir}/uniapp-v8-release.aar")
    def elfPatchScript = file("${rootProject.projectDir}/../tools/monitor/patch-weexcore-exit.ps1")
    inputs.file(vendorAar)
    inputs.file(elfPatchScript)
    outputs.upToDateWhen { !forceRunElfPatch }
    doLast {
        copy {
            from vendorAar
            into patchedLibsDir
        }
        def jniLibs = file("${rootProject.projectDir}/app/src/main/jniLibs").absolutePath
        exec {
            commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', elfPatchScript.absolutePath,
                    '-Aar', targetAar.absolutePath,
                    '-Entry', 'jni/arm64-v8a/libweexcore.so',
                    '-Patches', '1306E8:94054022:D503201F,130934:94053F97:D503201F,138DE4:97FFA02F:D503201F',
                    '-JniLibsDir', jniLibs
        }
        exec {
            commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', elfPatchScript.absolutePath,
                    '-Aar', targetAar.absolutePath,
                    '-Entry', 'jni/armeabi-v7a/libweexcore.so',
                    '-Patches', 'B98AA:EB5AF0E9:BF00BF00,B9A2E:EAA8F0E9:BF00BF00,BF7B8:FCF0F7EF:BF00BF00',
                    '-JniLibsDir', jniLibs
        }
    }
}
// 两个补丁任务都进任务图（互不依赖）
tasks.named('preBuild') {
    dependsOn patchTaskNames
    dependsOn 'patchWeexcoreExit'
}

// 必须配置（FileProvider authorities 引用）
def mfph = [
    "apk.applicationId": "com.qunze.xiju",
]

// native SIGALRM guard（libalarmguard.so）：**常驻**，放 src/main/jniLibs，无条件打进 APK。
// 作用：uni-app 运行时在启动 5~9 分钟后会由进程内 alarm 发出 SIGALRM(14) 杀死自己；
//       该 so 加载时（constructor）装上自己的 SIGALRM 处理器，使该信号不再致命，并打印来源 si_code/si_pid。
// 说明：这是刻意对进程级信号语义做的接管（只有该信号被忽略，其余信号不受影响）。
// 源码与编译命令：tools/monitor/alarmguard.c
android {
    namespace = "com.qunze.xiju"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.qunze.xiju"
        minSdkVersion 24          // Xilu-AD 插件要求 24
        targetSdkVersion 34
        versionCode 100
        versionName "1.0.0"
        multiDexEnabled true
        manifestPlaceholders = mfph
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // 与原生 Demo（android_demo_jdk8）使用同一份签名证书。
    // 关键：穿山甲等平台按「APK 签名 SHA1」校验媒体平台授权，用默认 debug keystore 会被拒
    // （日志：error=40021 apk签名SHA1值与媒体平台录入的SHA1不一致），
    // 进而整条聚合报"所有三方竞价广告位均没有获取到广告"。
    signingConfigs {
        xilu {
            storeFile file('keystore/xilu_release.keystore')
            storePassword System.getenv('XILU_STORE_PASSWORD')
            keyAlias 'release'
            keyPassword System.getenv('XILU_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.xilu
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false    // 开启前先补全 proguard-rules.pro
            signingConfig signingConfigs.xilu
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // 此处配置必须添加 否则无法正确运行（uni 官方要求）
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }

    // WeexCore 多进程 JS 引擎要求 so 解压到磁盘（否则 spinWaitPeer timeout → 白屏）
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// AGP 8+ 启用 v1(JAR) 签名：DCloud 离线打包部分模块仍按 v1 读取证书，
// 且老机型（API 24~27）只认 v1；官方示例要求 v1+v2 同时开启。
android.signingConfigs.xilu.enableV1Signing = true
android.signingConfigs.xilu.enableV2Signing = true

dependencies {
    // uni 离线 SDK 基础运行时（5.24）：lib.5plus.base 用 ASM 补丁副本、uniapp-v8 用 ELF 补丁副本
    implementation fileTree(include: [
        'breakpad-build-release.aar',
        'android-gif-drawable-1.2.29.aar',
        'uni-prompt-release.aar'    // 不再打补丁，直接用原始 AAR
    ], dir: sdkLibsDir)
    implementation files(patchedAars)                                   // lib.5plus.base 补丁副本
    implementation files("${patchedLibsDir}/uniapp-v8-release.aar")     // uniapp-v8 补丁副本

    // Xilu-AD 插件 AAR（Core + 6 Adapter + 6 三方底包，共 13 个）
    // 另外两块不走本地 AAR：
    //   ① 桥接插件 XiluADUniPlugin → 直接依赖 ../xilu-ad-bridge 源码工程（见 settings.gradle 的 include），
    //   ② 华为/荣耀 OAID → 线上官方仓库依赖
    implementation project(':xilu-ad-bridge')                                // 本项目桥接插件（源码直连）
    implementation files("${xiluAarDir}/XiluSDKCore-v1.0.8.5.aar")           // 西陆聚合 SDK Core
    // 6 个 Adapter（与下方底包一一对应：CSJ/GDT/BQT/KS/MS/BZ）
    implementation files("${xiluAarDir}/AdapterCSJ-v1.0.8.5.aar")
    implementation files("${xiluAarDir}/AdapterGDT-v1.0.8.5.aar")
    implementation files("${xiluAarDir}/AdapterBQT-v1.0.8.5.aar")
    implementation files("${xiluAarDir}/AdapterKS-v1.0.8.5.aar")
    implementation files("${xiluAarDir}/AdapterMS-v1.0.8.5.aar")
    implementation files("${xiluAarDir}/AdapterBZ-v1.0.8.5.aar")
    // 6 个三方广告底包
    implementation files("${xiluAarDir}/open_ad_sdk_7.5.1.0.aar")            // 穿山甲（AdapterCSJ）
    implementation files("${xiluAarDir}/GDT_SDK.4.662.1532.aar")             // 优量汇（AdapterGDT）
    implementation files("${xiluAarDir}/Baidu_MobAds_SDK-release_v9.450.aar")// 百青藤（AdapterBQT）
    implementation files("${xiluAarDir}/KS_AD_4.4.20.1.aar")                 // 快手（AdapterKS）
    implementation files("${xiluAarDir}/MS_AD_2.5.7.7.aar")                  // 美数 com.meishu（AdapterMS）
    implementation files("${xiluAarDir}/BZ_AD_5.2.1.21.aar")                 // 倍孜 com.beizi（AdapterBZ）
    // 华为 / 荣耀 OAID 标识 SDK：走线上官方仓库，不再放 vendor/xilu
    implementation 'com.huawei.hms:ads-identifier:3.4.62.300'
    implementation 'com.hihonor.mcs:ads-identifier:1.0.2.301'

    // uni 基础依赖（参照官方 UniMP Demo）
    implementation "androidx.recyclerview:recyclerview:1.1.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.appcompat:appcompat:1.1.0"
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'androidx.webkit:webkit:1.5.0'
    // MS(美数) AAR 布局引用 CardView 属性，需显式引入
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.core:core:1.6.0'
}

