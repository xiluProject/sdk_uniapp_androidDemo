// Xilu-AD 桥接层：唯一需要开发的 AAR（XiluADUniPlugin.aar）
// uni 离线 SDK 与 13 个业务 AAR 全部 compileOnly：运行时分别由基座与插件目录提供
plugins {
    // 版本由 settings.gradle 的 pluginManagement.plugins 或宿主 buildscript classpath 上的 AGP 决定；
    // 这里带 version 会让宿主报 already on the classpath
    id 'com.android.library'
}

android {
    namespace 'com.xilu.sdk.uni'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 产物命名：XiluADUniPlugin-release.aar
    libraryVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "XiluADUniPlugin-${variant.name}.aar"
        }
    }
}

dependencies {
    // uni 插件运行时（stub jar，仅编译期）
    compileOnly fileTree(dir: 'libs_uni', include: ['*.jar', '*.aar'])
    // 13 个业务 AAR（Core + 6 Adapter + 6 三方底包）仅编译期依赖，引用共享 vendor 目录以免与
    // xilu-uni-demo/nativeplugins 重复存储；桥接插件 AAR 不在 vendor 里，宿主直接依赖本工程源码
    compileOnly fileTree(dir: "${rootProject.projectDir}/../vendor/xilu", include: ['*.aar'])
    // uni 引擎数据协议（基座内置 fastjson）
    compileOnly 'com.alibaba:fastjson:1.2.83'
    // androidx（基座内置：SDK 构造器重载引用 Fragment/注解）
    compileOnly 'androidx.annotation:annotation:1.8.0'
    compileOnly 'androidx.fragment:fragment:1.6.2'
}

// 构建完成后自动把 bridge AAR 送进 HBuilderX 插件包目录。
// 运行方式：./gradlew assembleRelease copyToPlugin
task copyToPlugin(type: Copy) {
    description = '复制 bridge AAR 到 xilu-uni-demo/nativeplugins/Xilu-AD/android/'
    from layout.buildDirectory.dir('outputs/aar')
    into "${rootProject.projectDir}/../xilu-uni-demo/nativeplugins/Xilu-AD/android"
    include 'XiluADUniPlugin-release.aar'
}
copyToPlugin.dependsOn { assembleRelease }
